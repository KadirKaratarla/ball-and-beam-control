; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared by both environments below.
[base]
platform = espressif32
; "4d_systems_esp32s3_gen4_r8n16" board id is used purely because it's the only
; locally installed board definition that matches our actual chip variant
; (ESP32-S3 R8N16 = 8MB Octal PSRAM + 16MB Quad flash) with upload.flash_size
; already set correctly to 16MB; vendor name is irrelevant, framework=espidf
; doesn't use any vendor-specific pin mapping from this file.
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200

; The board presents two serial ports. COM11 is the CH343 UART bridge that
; carries the console and flashing; COM12 is the built-in USB-Serial-JTAG,
; which is the PC position link (gui/link.py) and must be left to it.
; Auto-detection picks either, so pin both here.
monitor_port = COM11
upload_port = COM11

; The application (Faz 2+). The Faz 1 test_*.c files compile to nothing
; here (each is wrapped in #ifdef BB_TESTS).
[env:esp32-s3-devkitc-1]
extends = base

; Faz 1 bring-up tests: `pio run -e tests -t upload`. main.c selects one
; test with ACTIVE_TEST when BB_TESTS is defined.
[env:tests]
extends = base
build_flags = -DBB_TESTS
