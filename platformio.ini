; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
; "4d_systems_esp32s3_gen4_r8n16" board id is used purely because it's the only
; locally installed board definition that matches our actual chip variant
; (ESP32-S3 R8N16 = 8MB Octal PSRAM + 16MB Quad flash) with upload.flash_size
; already set correctly to 16MB; vendor name is irrelevant, framework=espidf
; doesn't use any vendor-specific pin mapping from this file.
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200
