<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 496' width='940' height='496' role='img'>
<title>Signal flow</title>
<rect x='0' y='0' width='940' height='496' rx='8' fill='#ffffff' stroke='#d0d7de'/>
<text x='24.0' y='32.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1f2328' text-anchor='start' font-weight='600'>Signal flow</text>
<text x='24.0' y='52.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#6e7781' text-anchor='start' font-weight='400'>The ball's position is measured on the PC from the camera image; the control loop runs on the ESP32-S3 at 250 Hz.</text>
<defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,1 L9,5 L0,9' fill='#0969da'/></marker></defs>
