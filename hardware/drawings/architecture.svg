<text x='384.0' y='273.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>4 ms GPTimer ISR (250 Hz)</text>
<text x='384.0' y='288.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>pid.c: measurement-derivative PID</text>
<text x='384.0' y='303.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>linkage.c: θ → crank angle</text>
<text x='384.0' y='318.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>guards: θ, follow error, WDT</text>
<rect x='716.0' y='92.0' width='200.0' height='92.0' rx='7' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.6'/>
