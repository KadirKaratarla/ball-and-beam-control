<text x='728.0' y='254.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='600'>TMC2208 + NEMA 17</text>
<text x='728.0' y='273.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>1/256 microstep, 0.61 A rms</text>
<text x='728.0' y='288.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>LEDC pulses + PCNT count</text>
<text x='728.0' y='303.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>crank r=31 → rod l=90</text>
<text x='728.0' y='318.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>→ beam θ = ±3.13°</text>
<rect x='372.0' y='392.0' width='210.0' height='56.0' rx='7' fill='#fff1e5' stroke='#bc4c00' stroke-width='1.6'/>
