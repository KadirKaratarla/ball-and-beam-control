<text x='36.0' y='254.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='600'>PC — Python</text>
<text x='36.0' y='273.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>tracker.py: HSV threshold,</text>
<text x='36.0' y='288.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>projection onto the rail axis</text>
<text x='36.0' y='303.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>ui_main.py: PySide6 GUI</text>
<text x='36.0' y='318.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>camera and link: own processes</text>
