<text x='36.0' y='133.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>320x240 @ 100 fps</text>
<text x='36.0' y='148.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>libusbK + pseyepy</text>
<text x='36.0' y='163.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>fixed exposure and gain</text>
