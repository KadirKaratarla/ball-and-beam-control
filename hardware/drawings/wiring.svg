<text x='932.0' y='447.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#bc4c00' text-anchor='start' font-weight='600'>DIR gets its own wire</text>
<text x='932.0' y='462.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#bc4c00' text-anchor='start' font-weight='600'>to ground — see note 2</text>
<polyline points='950.0,232.0 906.0,232.0 906.0,148.0 886.0,148.0' fill='none' stroke='#bc4c00' stroke-width='2.0' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='886.0,182.0 932.0,182.0 932.0,125.0 950.0,125.0' fill='none' stroke='#1f2328' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/>
<rect x='40' y='670' width='1100' height='152' rx='7' fill='#f6f8fa' stroke='#d0d7de' stroke-width='1.2'/>
<text x='58.0' y='694.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='600'>Notes</text>
<text x='58.0' y='716.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>1.  PDN_UART is a single-wire half-duplex pin. TX reaches it through 1 kΩ, RX connects straight to the same node; without the resistor the ESP32 drives over the driver's reply and every read-back returns 0xFF.</text>
<text x='58.0' y='732.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>2.  AS5600 DIR must be tied to ground with its own wire. Left floating it picks up the I²C lines and flips polarity between reads, reporting the same angle alternately as x and 4096 − x.</text>
<text x='58.0' y='748.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>3.  HC-SR04 drives ECHO at 5 V, so it reaches GPIO11 through a 1 kΩ / 2 kΩ divider. The sensor is wired but unused: the ball's position comes from the camera.</text>
<text x='58.0' y='764.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>4.  MS1 and MS2 float — the microstep setting arrives over UART (mstep_reg_select = 1). CLK to ground selects the driver's internal 12 MHz oscillator. EN is active low. AS5600 OUT and GPO stay unconnected.</text>
<text x='58.0' y='780.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>5.  The AS5600 breakout carries its own 10 kΩ pull-ups, so the ESP32's internal ones are disabled. Bus runs at 400 kHz.</text>
<text x='58.0' y='796.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>6.  GPIO16 toggles once per control tick so a logic analyser can read the loop period independently of the firmware's own measurement.</text>
</svg>