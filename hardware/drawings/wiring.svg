<text x='24.0' y='720.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>MS1 and MS2 are left floating: microstepping is selected over UART (mstep_reg_select = 1). AS5600 OUT and GPO unused.</text>
<text x='24.0' y='736.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#6e7781' text-anchor='start' font-weight='400'>GPIO16 toggles once per control tick so a logic analyser can read the loop period independently of the firmware's own measurement.</text>
