<text x='922.0' y='418.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#bc4c00' text-anchor='start' font-weight='600'>Left floating it picks up the I2C</text>
<text x='922.0' y='434.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#bc4c00' text-anchor='start' font-weight='600'>lines and flips polarity between</text>
<text x='922.0' y='450.0' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10' fill='#bc4c00' text-anchor='start' font-weight='600'>reads — the angle comes back as</text>
